version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: eac-mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - /volume1/docker/eac/mysql:/var/lib/mysql
    networks:
      - eac-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    image: eac-backend:latest
    container_name: eac-backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eac
      SPRING_DATASOURCE_USERNAME: root
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eac-network
    restart: unless-stopped

networks:
  eac-network:
    driver: bridge