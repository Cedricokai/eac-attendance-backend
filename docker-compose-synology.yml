version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: eac-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: eac
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - eac-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p$MYSQL_ROOT_PASSWORD -e 'CREATE DATABASE IF NOT EXISTS eac_website; SELECT 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    command:
      - "--innodb-buffer-pool-size=256M"
      - "--max-connections=200"

  eac-system:
    build:
      context: ./eac-system
      dockerfile: Dockerfile
    container_name: eac-backend
    volumes:
      - /volume1/backups/eac:/volume1/backups/eac
      - backup_settings:/var/lib/eac-backup
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eac
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_LIQUIBASE_ENABLED: false
      APP_BACKUP_ROOT: /volume1/backups/eac
      APP_BACKUP_STATE_DIRECTORY: /var/lib/eac-backup
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eac-network
    restart: unless-stopped

  eac-website:
    build:
      context: ./eac-website
      dockerfile: Dockerfile
    container_name: eac-website
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eac_website
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eac-network
    restart: unless-stopped

networks:
  eac-network:
    driver: bridge

volumes:
  mysql_data:
  backup_settings:
