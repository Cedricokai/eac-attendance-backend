# Reference for the existing Synology reverse proxy; not an installer.
# Replace the hostname and use the NAS's existing trusted TLS certificate.
map $http_upgrade $eac_office_connection { default upgrade; '' close; }
server {
    listen 443 ssl;
    server_name office.eaconcept.org;
    # Keep your existing ssl_certificate / ssl_certificate_key configuration.
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $eac_office_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
