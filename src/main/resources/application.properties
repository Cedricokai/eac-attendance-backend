# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/eac
spring.datasource.username=root
spring.datasource.password=Cedkeys@22

spring.application.name=eac_backend-project
spring.liquibase.enabled=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jwt.secret=${JWT_SECRET:default_secret_key}
cors.allowedOrigins=http://localhost:5173
logging.level.io.jsonwebtoken=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.<com.eac.eac_inventory.service>=DEBUG
#spring.ai.openai.api-key=your-api-key
#spring.ai.openai.embedding.options.model=text-embedding-ada-002

# Disable Spring AI auto-configuration
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.neo4j.autoconfigure.Neo4jVectorStoreAutoConfiguration
# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
