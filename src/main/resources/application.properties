server.port=8080
# File suite transport ceiling; configurable per-file limits are enforced in the service.
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=501MB
app.files.storage-root=${APP_FILES_STORAGE_ROOT:./uploads/file-suite}
server.address=0.0.0.0

spring.application.name=eac_backend-project

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# JWT
jwt.secret=${JWT_SECRET}

# CORS
cors.allowedOrigins=http://localhost:5173,http://localhost:5174,http://192.168.1.97:5173,http://100.114.178.13:5173,https://cedricokai.github.io

# Logging
logging.level.com.example.eac_backend_project=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

## Change from update to validate or use Flyway/Liquibase
#spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true

# File upload
file.upload-dir=uploads
spring.web.resources.static-locations=file:uploads/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/

# Async
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=email-async-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# Email (non-environment specific)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=eacsys40@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.password=${SPRING_MAIL_PASSWORD}

app.email.sender=eacsys40@gmail.com
app.email.company-name=EAC System

app.email.base-url.local=http://192.168.1.97
app.email.base-url.public=https://eac-system.eaconcept.org

email.templates.leave.submitted=leave-request-submitted
email.templates.leave.supervisor-approval-request=supervisor-approval-request
email.templates.leave.planner-approval-request=planner-approval-request
email.templates.leave.hr-approval-request=hr-approval-request
email.templates.leave.approved=leave-approval-notification
email.templates.leave.rejected=leave-rejection-notification

# Disable Spring AI auto-configuration
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.neo4j.autoconfigure.Neo4jVectorStoreAutoConfiguration

app.email.base-url.lan=http://192.168.1.97:5173

app.frontend.base-url=https://eac-system.eaconcept.org
app.frontend.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://192.168.1.97:5173,http://100.114.178.13:5173,https://eac-system.eaconcept.org

# Communication keys remain server-side; no plaintext fallback.
app.communication.key=${APP_COMMUNICATION_KEY:}
app.communication.backup-root=${APP_COMMUNICATION_BACKUP_ROOT:./backups/communication}
app.communication.require-tls=${APP_COMMUNICATION_REQUIRE_TLS:false}

# Off by default. Explicit loopback-only local demo setup; never enable on deployment.

# ONLYOFFICE connector (separate from application authentication)
app.onlyoffice.enabled=${ONLYOFFICE_ENABLED:false}
app.onlyoffice.browser-url=${ONLYOFFICE_BROWSER_URL:http://localhost:8082}
app.onlyoffice.server-url=${ONLYOFFICE_SERVER_URL:http://localhost:8082}
app.onlyoffice.connector-url=${ONLYOFFICE_CONNECTOR_URL:http://host.docker.internal:8080}
app.onlyoffice.jwt-secret=${ONLYOFFICE_JWT_SECRET:}
app.onlyoffice.protected-ranges-verified=${ONLYOFFICE_PROTECTED_RANGES_VERIFIED:false}
app.onlyoffice.template-folder-id=${ONLYOFFICE_TEMPLATE_FOLDER_ID:}

# Stable encryption key for remembered document-opening passwords; never commit its value.
app.files.password-key=${APP_FILES_PASSWORD_KEY:}
