spring.datasource.url=jdbc:h2:file:./eac-db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR;TRACE_LEVEL_FILE=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.liquibase.enabled=false
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

app.email.base-url=http://localhost:5173
app.email.base-url.local=http://localhost:5173
app.email.base-url.public=http://localhost:5173
app.email.base-url.lan=http://localhost:5173
app.frontend.base-url=http://localhost:5173



