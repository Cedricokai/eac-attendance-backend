spring.config.import=file:./.env.local[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:false}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.files.backup-root=${APP_FILES_BACKUP_ROOT:./backups/file-suite}
app.files.collaboration-key=${APP_FILES_COLLABORATION_KEY:}

# Stable encryption key for remembered document-opening passwords; never commit its value.
app.files.password-key=${APP_FILES_PASSWORD_KEY:}
