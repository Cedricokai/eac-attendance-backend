<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; line-height:1.6;">
<h2>Password Reset Request</h2>

<p>Hello <strong th:text="${userName}">User</strong>,</p>

<p>Click the button below to reset your password:</p>

<p>
    <a th:href="${resetLink}"
       style="display:inline-block;padding:10px 16px;background:#1f2937;color:#fff;text-decoration:none;border-radius:6px;">
        Reset Password
    </a>
</p>

<p>If you did not request this, ignore this email.</p>

<hr/>

<p style="font-size:12px;color:#6b7280;">
    <span th:text="${companyName}">Company</span><br/>
    <span th:text="${companyEmail}">company@email.com</span><br/>
    <span th:text="${companyPhone}">phone</span><br/>
    <span th:text="${companyAddress}">address</span>
</p>
</body>
</html>
